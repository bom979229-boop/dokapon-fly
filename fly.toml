# fly.toml app configuration file generated for dokapon-bom-007 on 2026-10-30T03:05:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dokapon-bom-007'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  IDLE_MINUTES = '15'
  PORT = '8080'
  ROOM = 'bom999'

[[mounts]]
  source = 'dokapon_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[restart]]
  policy = 'on-failure'
  retries = 5

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
